# Default configuration for AWG, spectrum analyzer, oscilloscope, and waveform settings

instruments:
  awg:
    address: 'TCPIP0::localhost::hislip0::INSTR'        # LAN from M8195 Soft Front Panel
    timeout: 240000                                      # ms
  spectrum_analyzer:
    address: 'TCPIP0::10.164.17.219::hislip0::INSTR'    # LAN from Keysight Connection Expert
    timeout: 2400000                                     # ms
  oscilloscope:
    address: 'TCPIP0::169.254.7.103::inst0::INSTR'
    timeout: 10000                                      # ms

waveform:
  sample_rate: 64000000000                               # in Sa/s for AWG
  num_periods: 1
  amplitude: 2.0                                         # Vpp
  dc_offset: 0                                           # V
  noise_density_vrthz: 3e-7                                  # V/sqrt(Hz); null disables
  amplitude_policy: strict                           # strict|safe
  clip_k_sigma: 6.0                                  # used for conservative clip prediction
  min_noise_segment_ms: 50            # enforce longer segments when noise_* present
  noise_update_period_ms: 50          # how often NoiseStreamer updates segments
  noise_seed: 12345                 # null disables deterministic noise




spectrum_analyzer:
  center_frequency:
  span:
  averaging: 1
  resolution_bandwidth:
  video_bandwidth: null
  detector: RMS
  avg_on: true
  avg_count: 20
  atten_db: 
  preamp_on: false
  preamp_gain_db: 10                # dB


oscilloscope:
  timebase_scale:
  vertical_scale:
  trigger_mode:


logging:
  file:
  level:
